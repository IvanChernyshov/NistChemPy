name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_online:
        description: Run live NIST Chemistry WebBook integration tests
        required: false
        default: 'false'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -q

  online:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_online == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,structure]"
      - name: Run online tests
        run: pytest -q -m network
