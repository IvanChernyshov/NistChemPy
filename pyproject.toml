[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nistchempy"
authors = [
    {name = "Ivan Yu. Chernyshov", email = "ivan.chernyshoff@gmail.com"}
]
maintainers = [
    {name = "Ivan Yu. Chernyshov", email = "ivan.chernyshoff@gmail.com"}
]
description = "Unofficial Python tools for querying NIST Chemistry WebBook pages and extracting molecular-property records"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md"}
keywords = [
    "NIST Chemistry WebBook",
    "chemical data",
    "molecular properties",
    "spectral data",
    "mass spectra",
    "infrared spectra",
    "gas chromatography",
    "cheminformatics",
    "scientific Python",
    "physical chemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "importlib-resources>=1.1.0; python_version<'3.9'",
  "requests",
  "pandas",
  "bs4"
]
requires-python = ">= 3.7"
dynamic = ["version"]

[project.urls]
Documentation = "https://ivanchernyshov.github.io/NistChemPy/"
Repository = "https://github.com/IvanChernyshov/NistChemPy.git"
Issues = "https://github.com/IvanChernyshov/NistChemPy/issues"
Citation = "https://doi.org/10.5281/zenodo.20235917"

[tool.setuptools.dynamic]
version = {attr = "nistchempy.__version__"}


